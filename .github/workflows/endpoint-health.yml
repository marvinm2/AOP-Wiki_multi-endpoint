name: endpoint-health

# Daily liveness + sanity check of the live multi-version SPARQL endpoint, so a
# silent production regression (endpoint down, graphs dropped, reload gone wrong)
# is surfaced even when nobody is looking. Opens an issue on scheduled failure.

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      ENDPOINT: https://aopwiki-multirdf.vhp4safety.nl/sparql
      MIN_GRAPHS: '30'  # floor; ~33 quarterly snapshots are loaded today
    steps:
      - name: Count named graphs
        run: |
          set -euo pipefail
          QUERY='SELECT (COUNT(DISTINCT ?g) AS ?n) WHERE { GRAPH ?g { ?s ?p ?o } FILTER(STRSTARTS(STR(?g), "http://aopwiki.org/graph/")) }'
          resp=$(curl -sS -m 60 --get "$ENDPOINT" \
            --data-urlencode "query=$QUERY" \
            -H "Accept: application/sparql-results+json")
          echo "Response: $resp"
          count=$(echo "$resp" | jq -r '.results.bindings[0].n.value // "0"')
          echo "Named graphs: $count (floor: $MIN_GRAPHS)"
          if ! [ "$count" -ge "$MIN_GRAPHS" ] 2>/dev/null; then
            echo "::error::Endpoint unhealthy: $count graphs (< $MIN_GRAPHS) or unreachable"
            exit 1
          fi
          echo "OK"

      - name: Newest graph is current
        # AOP-Wiki publishes a snapshot on the 1st of Jan/Apr/Jul/Oct. Once a quarter
        # start is more than LAG_DAYS old, its graph should be loaded.
        env:
          LAG_DAYS: '21'
        run: |
          set -euo pipefail
          QUERY='SELECT (MAX(STR(?g)) AS ?g) WHERE { GRAPH ?g { ?a a <http://aopkb.org/aop_ontology#AdverseOutcomePathway> } FILTER(STRSTARTS(STR(?g), "http://aopwiki.org/graph/")) }'
          newest=$(curl -sS -m 60 --get "$ENDPOINT" --data-urlencode "query=$QUERY" \
            -H "Accept: application/sparql-results+json" | jq -r '.results.bindings[0].g.value' | sed 's#.*/##')
          ref=$(date -u -d "-${LAG_DAYS} days" +%Y-%m-%d)
          y=${ref:0:4}; m=$((10#${ref:5:2}))
          expected=$(printf '%s-%02d-01' "$y" $(( (m - 1) / 3 * 3 + 1 )))
          echo "Newest graph: $newest; expected at least: $expected (quarter start older than ${LAG_DAYS} days)"
          if [[ "$newest" < "$expected" ]]; then
            echo "::error::Newest graph $newest is behind the $expected quarter"
            exit 1
          fi

      - name: Catalogue matches the graphs
        run: |
          set -euo pipefail
          q() { curl -sS -m 60 --get "$ENDPOINT" --data-urlencode "query=$1" \
            -H "Accept: application/sparql-results+json" | jq -r '.results.bindings[0].v.value // ""'; }
          graph_max=$(q 'SELECT (MAX(STR(?g)) AS ?v) WHERE { GRAPH ?g { ?a a <http://aopkb.org/aop_ontology#AdverseOutcomePathway> } FILTER(STRSTARTS(STR(?g), "http://aopwiki.org/graph/")) }' | sed 's#.*/##')
          cat_max=$(q 'SELECT (MAX(STR(?x)) AS ?v) WHERE { GRAPH <http://aopwiki-multirdf.vhp4safety.nl/metadata> { ?d <http://www.w3.org/2002/07/owl#versionInfo> ?x } }')
          echo "Newest graph: $graph_max; newest catalogue version: $cat_max"
          if [[ "$graph_max" != "$cat_max" ]]; then
            echo "::error::Catalogue ($cat_max) does not match the newest graph ($graph_max)"
            exit 1
          fi

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "SPARQL endpoint health check failed on $(date -I)" \
            --body "The multi-version SPARQL endpoint health check failed: the endpoint was unreachable, the graph count is below ${MIN_GRAPHS}, the newest graph is behind the current quarter, or the version catalogue lags the graphs. Inspect: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
